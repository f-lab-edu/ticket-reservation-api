spring:
  application:
    name: ticket-reservation-api
  config:
    # 로컬 개발 시 프로젝트 루트의 .env(Git 제외)에서 JWT_SECRET 등을 읽는다. 파일이 없으면 무시한다.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/ticketing}
    username: ${DB_USERNAME:ticketing_app}
    password: ${DB_PASSWORD:local-app-password}
  jpa:
    hibernate:
      # 스키마는 Flyway 마이그레이션(db/migration)으로 관리하고, Hibernate는 엔티티와 일치하는지만 검증한다.
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      timeout: 1s
      connect-timeout: 1s
      repositories:
        enabled: false

auth:
  # HS256 서명 키(32바이트 이상). 기본값을 두지 않아 설정이 없으면 기동에 실패한다.
  jwt-secret: ${JWT_SECRET}
  access-token-validity: 30m
  refresh-token:
    validity: 7d
    # 만료 후 Redis에서 삭제되기까지 기록을 보존하는 기간(토큰 재사용 탐지 용도)
    retention: 3d
